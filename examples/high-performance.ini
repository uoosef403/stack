# High Performance Configuration
# Optimized for maximum throughput and low latency

[network]
interface_name=tun0
interface_ip=10.0.0.1
interface_netmask=255.255.255.0
mtu=9000  # Jumbo frames for high throughput

[proxy]
enable_socks5=false  # Direct connections for maximum performance

[logging]
log_level=warn  # Minimal logging for performance
console_output=true

[tcp]
connection_timeout_ms=5000     # Fast timeout for low latency
keep_alive_interval_ms=30000   # Frequent keep-alives
max_connections=5000           # High connection limit
buffer_size=131072             # Large buffers for throughput

[udp]
timeout_ms=1000               # Fast UDP timeout
max_connections=2000          # High UDP connection limit

[icmp]
enable=true
timeout_ms=1000               # Fast ICMP timeout
