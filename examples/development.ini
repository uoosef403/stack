# Development Configuration
# Optimized for debugging and development work

[network]
interface_name=tun-dev
interface_ip=192.168.100.1
interface_netmask=255.255.255.0
mtu=1500

[proxy]
enable_socks5=true
socks5_host=127.0.0.1
socks5_port=1080

[logging]
log_level=debug               # Verbose logging for development
console_output=true
log_file=debug.log           # Log to file for analysis

[tcp]
connection_timeout_ms=60000   # Generous timeouts for debugging
keep_alive_interval_ms=120000
max_connections=100           # Lower limits for easier debugging
buffer_size=32768

[udp]
timeout_ms=10000             # Generous UDP timeout
max_connections=50

[icmp]
enable=true
timeout_ms=10000             # Generous ICMP timeout
