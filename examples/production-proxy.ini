# Production SOCKS5 Proxy Configuration
# Secure configuration for production proxy usage

[network]
interface_name=tun-proxy
interface_ip=172.16.0.1
interface_netmask=255.255.0.0
mtu=1500

[proxy]
enable_socks5=true
socks5_host=proxy.internal.corp
socks5_port=1080
# Note: For security, credentials should be set via environment variables
# or a separate secure configuration file

[logging]
log_level=info               # Production logging level
console_output=false         # No console output in production
log_file=/var/log/network-stack.log

[tcp]
connection_timeout_ms=30000  # Standard timeouts
keep_alive_interval_ms=60000
max_connections=2000         # Production connection limits
buffer_size=65536

[udp]
timeout_ms=5000
max_connections=1000

[icmp]
enable=true
timeout_ms=5000
